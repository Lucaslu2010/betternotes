name: BetterNotes
options:
  bundleIdPrefix: com.betternotes
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
    CODE_SIGN_STYLE: Automatic
    # Personal (free) Apple team, read from the signing certificate's OU.
    # Needed to build for a physical device at all -- and installing a
    # development build is what makes iOS reveal Settings > Privacy &
    # Security > Developer Mode, which is hidden until then.
    # The paid Developer Program is only required later, for TestFlight.
    #
    # Project-wide rather than on the app target alone: a UI test runs from a
    # second signed bundle and the unit tests from a third, so `xcodebuild
    # build-for-testing` against a device failed with "Signing for
    # BetterNotesUITests requires a development team" while the app itself
    # built and installed perfectly well.
    DEVELOPMENT_TEAM: RQLD7J8CV7
  configs:
    Debug:
      # Local USB development signing; release keeps the repository's team.
      DEVELOPMENT_TEAM: D98JSNGGGQ
targets:
  BetterNotes:
    type: application
    platform: iOS
    sources:
      - path: BetterNotes
    info:
      path: BetterNotes/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: BetterNotes Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.betternotes.archive]
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.png, public.heic, public.heif, public.tiff, com.compuserve.gif, com.microsoft.bmp, org.webmproject.webp]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.betternotes.notebook-reference
            UTTypeDescription: BetterNotes Notebook Reference
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: com.betternotes.archive
            UTTypeDescription: BetterNotes Notebook
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [betternotes]
              public.mime-type: application/vnd.betternotes.notebook+json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny-lhs.betternotes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: "NO"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BetterNotes uses the microphone to record audio memos in your notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BetterNotes needs access to your photo library to insert images into notes."
        INFOPLIST_KEY_NSCameraUsageDescription: "BetterNotes uses the camera when you choose to scan a document into a note."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "BetterNotes uses speech recognition when you choose to transcribe an audio note."
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucaslu.betternotes.dev
  BetterNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetterNotesTests
    dependencies:
      - target: BetterNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betternotes.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucaslu.betternotes.dev.tests
  BetterNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BetterNotesUITests
    dependencies:
      - target: BetterNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betternotes.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lucaslu.betternotes.dev.uitests

schemes:
  BetterNotes:
    build:
      targets:
        BetterNotes: all
        BetterNotesTests: [test]
    test:
      targets:
        - BetterNotesTests
        - BetterNotesUITests
