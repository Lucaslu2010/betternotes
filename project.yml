name: BetterNotes
options:
  bundleIdPrefix: com.betternotes
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    # Personal (free) Apple team, read from the signing certificate's OU.
    # Needed to build for a physical device at all -- and installing a
    # development build is what makes iOS reveal Settings > Privacy &
    # Security > Developer Mode, which is hidden until then.
    # The paid Developer Program is only required later, for TestFlight.
    #
    # Project-wide rather than on the app target alone: a UI test runs from a
    # second signed bundle and the unit tests from a third, so `xcodebuild
    # build-for-testing` against a device failed with "Signing for
    # BetterNotesUITests requires a development team" while the app itself
    # built and installed perfectly well.
    DEVELOPMENT_TEAM: RQLD7J8CV7
targets:
  BetterNotes:
    type: application
    platform: iOS
    sources:
      - path: BetterNotes
    info:
      path: BetterNotes/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "BetterNotes finds your paired Mac on the same network to sync editable notebooks."
        NSBonjourServices:
          - _better-notes._tcp
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.betternotes.archive
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - betternotes
              public.mime-type:
                - application/x-betternotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny-lhs.betternotes
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: "NO"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BetterNotes uses the microphone to record audio memos in your notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BetterNotes needs access to your photo library to insert images into notes."
        INFOPLIST_KEY_NSCameraUsageDescription: "BetterNotes uses the camera when you choose to scan a document into a note."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "BetterNotes uses speech recognition when you choose to transcribe an audio note."
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: BetterNotes/BetterNotes.entitlements
  BetterNotesMac:
    type: application
    platform: macOS
    sources:
      - path: BetterNotesMac
      - path: BetterNotes/Models/Notebook.swift
      - path: BetterNotes/Models/TextAlign.swift
      - path: BetterNotes/Models/RichTextCodec.swift
      - path: BetterNotes/Models/AssistantModels.swift
      - path: BetterNotes/Services/InkQuestion.swift
      - path: BetterNotes/Services/AIModels.swift
      - path: BetterNotes/Services/AIClient.swift
      - path: BetterNotes/Services/AISettingsStore.swift
      - path: BetterNotes/Services/AppLocalization.swift
      - path: BetterNotes/Services/NoteCorpusIndexer.swift
      - path: BetterNotes/Services/AssistantCoordinator.swift
      - path: BetterNotes/Services/CloudTranslator.swift
      - path: BetterNotes/Services/NearbySync.swift
    info:
      path: BetterNotesMac/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "BetterNotes finds your paired iPad on the same network to sync editable notebooks."
        NSBonjourServices:
          - _better-notes._tcp
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.betternotes.archive
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - betternotes
              public.mime-type:
                - application/x-betternotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny-lhs.betternotes.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: BetterNotesMac/BetterNotesMac.entitlements
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
  BetterNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetterNotesTests
    dependencies:
      - target: BetterNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betternotes.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
  BetterNotesMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BetterNotesMacTests
    dependencies:
      - target: BetterNotesMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betternotes.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
  BetterNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BetterNotesUITests
    dependencies:
      - target: BetterNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.betternotes.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BetterNotes:
    build:
      targets:
        BetterNotes: all
        BetterNotesTests: [test]
    test:
      targets:
        - BetterNotesTests
        - BetterNotesUITests
  BetterNotesMac:
    build:
      targets:
        BetterNotesMac: all
        BetterNotesMacTests: [test]
    test:
      targets:
        - BetterNotesMacTests
